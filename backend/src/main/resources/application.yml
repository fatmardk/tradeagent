server:
  port: 8080

backend:
  # Canonical analytical exports produced by the Python pipeline
  # (src/ingestion/export_backend.py). A future PostgreSQL repository
  # implements the same interfaces — no service changes needed.
  data-dir: ../data/export
  valuation:
    # Placeholder — NOT empirically calibrated yet. Snapshot evidence so
    # far only covers intra-day (0d) and ~8-day gaps. See
    # docs/s3-validation-report.md before changing this value.
    max-obs-age-days: 45
    # ISO date the engine treats as "now" for staleness checks. Leave
    # empty to use the latest observed_date present in the data —
    # correct while the dataset carries periodic snapshot dates.
    as-of: ""
    grade-segment: A
